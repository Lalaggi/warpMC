name: Build
# COST CONTROL: GitHub Actions runs on cloud minutes ($). To avoid any cloud cost,
# this workflow is manual-only. All CI is on GitLab local podman runners (zero cloud cost).
# If you must run on GitHub, trigger manually via Actions tab > Build > Run workflow.
# Previous auto triggers (push/pull_request on ver/** warp/**) were removed 2026-08-22.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Build Bundler Jar
        run: ./gradlew createMojmapBundlerJar --stacktrace && ls -lh purpur-server/build/libs/*.jar
      - name: Upload Jars
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: warpmc-${{ github.sha }}
          path: |
            purpur-server/build/libs/*.jar
            purpur-api/build/libs/*.jar
          retention-days: 7
      - name: Rebuild on Failure
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache --refresh-dependencies
          ./gradlew applyAllPatches --stacktrace 
          ./gradlew build --stacktrace
